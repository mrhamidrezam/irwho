<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" fill="none" role="img" aria-label="irwho — WHOIS toolkit for .ir domains">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.55" stop-color="#111a2b"/>
      <stop offset="1" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="brand" x1="56" y1="60" x2="420" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3fe0c8"/>
      <stop offset="1" stop-color="#5aa9ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(840 40) rotate(90) scale(280 340)">
      <stop offset="0" stop-color="#3fe0c8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3fe0c8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="400" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="400" rx="22" fill="url(#glow)"/>
  <rect x="1" y="1" width="998" height="398" rx="21" stroke="#233047" stroke-opacity="0.75"/>

  <text x="56" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="82" font-weight="800" fill="url(#brand)" letter-spacing="-3">irwho</text>

  <rect x="318" y="70" width="76" height="44" rx="13" fill="#3fe0c8" fill-opacity="0.12" stroke="#3fe0c8" stroke-opacity="0.45"/>
  <text x="356" y="101" text-anchor="middle" font-family="ui-monospace, monospace" font-size="25" font-weight="700" fill="#3fe0c8">.ir</text>

  <text x="58" y="168" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#93a4bd">Check availability · scan in bulk · invent brandable names</text>

  <rect x="56" y="204" width="888" height="152" rx="14" fill="#0a0f1a" stroke="#233047"/>
  <circle cx="84" cy="232" r="6" fill="#ff5f57"/>
  <circle cx="106" cy="232" r="6" fill="#febc2e"/>
  <circle cx="128" cy="232" r="6" fill="#28c840"/>

  <text x="82" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#e6edf7"><tspan fill="#3fe0c8">$</tspan> irwho web,saz,besaz --limit 3</text>
  <text x="82" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#7d8aa0">besazweb.ir<tspan x="330" fill="#3fe0c8" font-weight="700">available</tspan></text>
  <text x="82" y="338" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#7d8aa0">sazweb.ir<tspan x="330" fill="#5a6478">taken</tspan></text>
</svg>
